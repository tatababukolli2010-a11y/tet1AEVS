<title>AP TET 1A EVS క్విజ్ 1–50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@600;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>
/* Layout: single centred column — photo header, question card, number grid, credit footer */
:root{
  --bg:#eef3ea; --surface:#ffffff; --ink:#1b2a1e; --muted:#566b59; --line:#cddbc8;
  --leaf:#2e6b3c; --leaf-soft:#dcebd9; --sun:#e2a516; --sun-soft:#fbefcc;
  --ok:#1f7a3a; --ok-soft:#d8f0dd; --bad:#b3261e; --bad-soft:#f8dcd9;
  --display:"Baloo Tammudu 2","Noto Sans Telugu",system-ui,sans-serif;
  --body:"Noto Sans Telugu","Nirmala UI","Gautami",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a14; --surface:#1b261d; --ink:#e7efe5; --muted:#a6b9a8; --line:#2f4033;
  --leaf:#7cc98c; --leaf-soft:#22382a; --sun:#f0bf45; --sun-soft:#3a3120;
  --ok:#6fd38a; --ok-soft:#1d3a26; --bad:#ff8a80; --bad-soft:#3e2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a14; --surface:#1b261d; --ink:#e7efe5; --muted:#a6b9a8; --line:#2f4033;
  --leaf:#7cc98c; --leaf-soft:#22382a; --sun:#f0bf45; --sun-soft:#3a3120;
  --ok:#6fd38a; --ok-soft:#1d3a26; --bad:#ff8a80; --bad-soft:#3e2220; color-scheme:dark}
html{font-size:20px}
@media (min-width:700px){html{font-size:22px}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;font-size:1rem}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  background:linear-gradient(160deg,var(--leaf) 0%,#1f4f2b 100%);color:#fff;border-radius:22px;padding:22px 16px}
header img{width:132px;height:132px;object-fit:cover;object-position:top;border-radius:50%;border:5px solid var(--sun);box-shadow:0 6px 18px rgba(0,0,0,.25)}
header .who{font-weight:700;font-size:1.05rem}
header h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.25;margin:0;text-wrap:balance}
header .sub{font-size:.95rem;opacity:.92;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;border:2px solid var(--leaf);background:transparent;color:var(--leaf);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--bg)}
.score{font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem}
.score b{color:var(--ok)} .score i{color:var(--bad);font-style:normal}
.progress{height:12px;background:var(--leaf-soft);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.qnum{font-family:var(--display);font-weight:800;color:var(--leaf);font-size:1.15rem;letter-spacing:.02em}
.q{font-size:1.3rem;font-weight:700;line-height:1.5}
.q .te{display:block;font-weight:600;color:var(--leaf);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:1.15rem;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;
  padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt:focus-visible,.chip:focus-visible,.nav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt .n{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.opt .t{min-width:0} .opt .t .te{display:block;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)} .opt.correct .n{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .n{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.exp{border-radius:14px;padding:14px 16px;background:var(--sun-soft);border:2px dashed var(--sun);font-size:1.1rem}
.exp h3{margin:0 0 6px;font-family:var(--display);font-size:1.15rem}
.exp p{margin:0} .exp p+p{margin-top:6px}
.verdict-ok{color:var(--ok)} .verdict-bad{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between}
.nav button{font:inherit;font-size:1.05rem;font-weight:700;padding:12px 18px;border-radius:14px;border:none;cursor:pointer;flex:1}
.prev{background:var(--leaf-soft);color:var(--leaf)} .next{background:var(--leaf);color:var(--bg)}
.nav button:disabled{opacity:.4;cursor:default}
.gridwrap h2{font-family:var(--display);font-size:1.15rem;margin:0 0 8px;color:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.grid button{font:inherit;font-size:.95rem;font-weight:700;padding:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:3px solid var(--sun);outline-offset:1px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--leaf);line-height:1}
.result .msg{font-size:1.2rem;font-weight:700}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.result .row button{font:inherit;font-weight:700;padding:12px 18px;border-radius:14px;border:none;cursor:pointer;background:var(--leaf);color:var(--bg)}
.result .row button.alt{background:var(--sun);color:#1b2a1e}
footer{text-align:center;background:var(--leaf);color:#fff;border-radius:18px;padding:16px;font-size:1.05rem;font-weight:700;line-height:1.6}
footer small{display:block;font-weight:400;font-size:.85rem;opacity:.9}
.hide-en .en{display:none} .hide-te .te{display:none}
.hide-en .q .te{margin-top:0;color:var(--ink)} .hide-en .opt .t .te{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const Q=[
["This part of the plant fixes it to the ground","మొక్కలోని ఈ భాగం దానిని నేలలో స్థిరపరుస్తుంది",[["Stem","కాండం"],["Leaf","పత్రం"],["Root","వేరు"],["Fruit","ఫలం"]],3,"వేరు నేలలోకి లోతుగా పెరిగి మొక్కను గట్టిగా పట్టి ఉంచుతుంది. అందుకే గాలికి కూడా మొక్క పడిపోదు.","Roots grow deep into the soil and anchor the plant firmly."],
["This part of the plant absorbs water and minerals from soil","నేల నుండి నీటిని మరియు లవణాలను శోషించే మొక్కలోని భాగం",[["Stem","కాండం"],["Root","వేరు"],["Leaf","పత్రం"],["Flower","పుష్పం"]],2,"వేరుపై ఉండే సన్నని మూలకేశాలు నేల నుండి నీటిని, ఖనిజ లవణాలను గ్రహిస్తాయి.","Root hairs absorb water and minerals from the soil."],
["This part of the plant carries water and nutrients from the root to all parts","వేర్ల నుండి నీటిని, లవణాలను మొక్కలోని అన్ని భాగాలకు చేరవేసే భాగం",[["Stem","కాండం"],["Leaf","పత్రం"],["Fruit","ఫలం"],["Flower","పుష్పం"]],1,"కాండంలోని దారువు (Xylem) నీటిని పైకి, పోషక కణజాలం (Phloem) ఆహారాన్ని అన్ని భాగాలకు రవాణా చేస్తాయి.","The stem's xylem carries water up; phloem carries food to all parts."],
["Identify the tree among the following","కింది వానిలో చెట్టును (వృక్షం) గుర్తించండి",[["Rose","గులాబీ"],["Hibiscus","మందార"],["Tulsi","తులసి"],["Tamarind","చింత"]],4,"చింతకు ఎత్తైన, మందమైన, గట్టి కాండం ఉంటుంది – ఇది వృక్షం. గులాబీ, మందార పొదలు; తులసి గుల్మం.","Tamarind has a tall, thick, woody trunk. Rose and hibiscus are shrubs; tulsi is a herb."],
["Identify the shrub among the following","కింది వానిలో పొదను గుర్తించండి",[["Banyan","మర్రి"],["Hibiscus","మందార"],["Wheat","గోధుమ"],["Bitter gourd","కాకర"]],2,"మందారకు నేల దగ్గర నుండే అనేక గట్టి కొమ్మలు వస్తాయి – ఇదే పొద లక్షణం. మర్రి వృక్షం, గోధుమ గుల్మం, కాకర ఎగబాకే తీగ.","Hibiscus has many woody branches from near the ground – a shrub."],
["Identify the creeper among the following","కింది వానిలో పాకే మొక్కను (నేలపై పాకేది) గుర్తించండి",[["Pumpkin","గుమ్మడి"],["Grape","ద్రాక్ష"],["Tulsi","తులసి"],["Rose","గులాబీ"]],1,"గుమ్మడి కాండం బలహీనంగా ఉండి నేలపై పాకుతుంది. ద్రాక్ష ఆధారాన్ని పట్టుకొని పైకి ఎగబాకే మొక్క (Climber).","Pumpkin's weak stem spreads on the ground (creeper). Grape climbs a support (climber)."],
["Identify the herb among the following","కింది వానిలో గుల్మాన్ని గుర్తించండి",[["Hibiscus","మందార"],["Rose","గులాబీ"],["Tulsi","తులసి"],["Watermelon","పుచ్చ"]],3,"తులసి మెత్తని, పచ్చని కాండం కలిగిన చిన్న మొక్క – గుల్మం. పుచ్చ నేలపై పాకే మొక్క.","Tulsi is a small plant with a soft green stem – a herb."],
["This part of the plant is called the food factory","మొక్కలలో ఆహార కర్మాగారంగా పిలువబడే భాగం",[["Stem","కాండం"],["Leaf","పత్రం"],["Root","వేరు"],["Fruit","ఫలం"]],2,"ఆకులలోని పత్రహరితం సూర్యరశ్మి సహాయంతో కిరణజన్య సంయోగక్రియ ద్వారా ఆహారం తయారు చేస్తుంది.","Leaves contain chlorophyll and make food by photosynthesis."],
["The leaves of this plant look like our palm","ఈ మొక్క ఆకులు మన అరచేతిలా కనిపిస్తాయి",[["Banana","అరటి"],["Hibiscus","మందార"],["Pudina","పుదీనా"],["Papaya","బొప్పాయి"]],4,"బొప్పాయి ఆకు చేతి వేళ్లలా చీలి ఉంటుంది – దీనిని హస్తాకార ఆకు అంటారు.","A papaya leaf is lobed like fingers spread from the palm (palmate leaf)."],
["The leaves of this plant do not have a specific aroma","ఈ మొక్క ఆకులకు ప్రత్యేకమైన వాసన ఉండదు",[["Banana","అరటి"],["Coriander","కొత్తిమీర"],["Pudina","పుదీనా"],["Tulsi","తులసి"]],1,"కొత్తిమీర, పుదీనా, తులసి ఆకులు సువాసన కలిగి ఉంటాయి. అరటి ఆకుకు ప్రత్యేక వాసన ఉండదు.","Coriander, mint and tulsi leaves are aromatic; banana leaves are not."],
["Identify the domesticated animal among the following","కింది వానిలో మచ్చిక చేసుకున్న (పెంపుడు) జంతువును గుర్తించండి",[["Donkey","గాడిద"],["Zebra","జీబ్రా"],["Fox","నక్క"],["Wolf","తోడేలు"]],1,"గాడిదను బరువులు మోయడానికి మనిషి పెంచుకుంటాడు. జీబ్రా, నక్క, తోడేలు అడవి జంతువులు.","Donkeys are reared to carry loads; the others are wild animals."],
["This animal is reared by man for milk and meat","పాలు మరియు మాంసం కొరకు మానవుడు పెంచుకునే జంతువు",[["Zebra","జీబ్రా"],["Horse","గుర్రం"],["Goat","మేక"],["Giraffe","జిరాఫీ"]],3,"మేకను పాలు, మాంసం కోసం పెంచుతారు. గుర్రం ప్రయాణం, బరువుల కోసం.","Goats are reared for milk and meat."],
["This animal lives on land and in water also","నేల మీద మరియు నీటిలోనూ జీవించే జంతువు",[["Fish","చేప"],["Salamander","సాలమాండర్"],["Rabbit","కుందేలు"],["Grasshopper","మిడత"]],2,"సాలమాండర్ కప్పలాగే ఉభయచరం – నేల మీద, నీటిలో రెండు చోట్లా జీవిస్తుంది.","The salamander is an amphibian, like the frog."],
["Identify the herbivore among the following","కింది వానిలో శాకాహారిని గుర్తించండి",[["Wolf","తోడేలు"],["Giraffe","జిరాఫీ"],["Rat","ఎలుక"],["Bear","ఎలుగుబంటి"]],2,"జిరాఫీ పొడవైన మెడతో ఎత్తైన చెట్ల ఆకులు మాత్రమే తింటుంది. ఎలుక, ఎలుగుబంటి ఉభయాహారులు; తోడేలు మాంసాహారి.","The giraffe eats only leaves. Rat and bear are omnivores; wolf is a carnivore."],
["Which of these is not a carnivore?","కింది వానిలో మాంసాహారి కానిది",[["Pig","పంది"],["Lion","సింహం"],["Shark","సొరచేప"],["Fox","నక్క"]],1,"పంది మొక్కలు, జంతువులు రెండింటినీ తినే ఉభయాహారి. మిగిలినవి మాంసాహారులు.","The pig eats both plants and animals – an omnivore."],
["Identify the omnivore among the following","కింది వానిలో ఉభయాహారిని గుర్తించండి",[["Hen","కోడి"],["Wolf","తోడేలు"],["Zebra","జీబ్రా"],["Giraffe","జిరాఫీ"]],1,"కోడి గింజలతో పాటు పురుగులను కూడా తింటుంది – ఉభయాహారి.","The hen eats grains as well as insects."],
["This is not an example of a natural scavenger","సహజ పారిశుద్ధ్య కార్మికులకు ఉదాహరణ కానిది",[["Vulture","రాబందు"],["Crow","కాకి"],["Fox","నక్క"],["Bear","ఎలుగుబంటి"]],4,"రాబందు, కాకి, నక్క చనిపోయిన జంతువుల కళేబరాలను తిని పరిసరాలను శుభ్రం చేస్తాయి. ఎలుగుబంటి అలా చేయదు.","Vultures, crows and foxes eat dead animals and clean the surroundings."],
["This is an example of a natural scavenger","సహజ పారిశుద్ధ్య కార్మికునికి ఉదాహరణ",[["Rat","ఎలుక"],["Hen","కోడి"],["Crow","కాకి"],["Lion","సింహం"]],3,"కాకి వ్యర్థాలు, చనిపోయిన జీవులను తిని పరిసరాలను శుభ్రంగా ఉంచుతుంది.","The crow eats waste and dead animals, cleaning the surroundings."],
["The organism that feeds on nuts and seeds is","గింజలు మరియు విత్తనాలను ఆహారంగా తీసుకునే జీవి",[["Squirrel","ఉడుత"],["Shark","సొరచేప"],["Snake","పాము"],["Wolf","తోడేలు"]],1,"ఉడుత పదునైన ముందు పళ్లతో గింజలను కొరికి తింటుంది.","The squirrel gnaws nuts and seeds with its sharp front teeth."],
["This organism has a boat-shaped body, fins, tail and gills to live in water","నీటిలో నివసించడానికి పడవ వంటి శరీరం, వాజాలు, తోక మరియు మొప్పలు కలిగిన జీవి",[["Salamander","సాలమాండర్"],["Frog","కప్ప"],["Fish","చేప"],["Hippo","నీటి ఏనుగు"]],3,"చేప శరీరం పడవ ఆకారంలో ఉండి సులభంగా ఈదుతుంది. మొప్పల ద్వారా నీటిలో కరిగిన ఆక్సిజన్‌ను పీలుస్తుంది.","A streamlined body helps the fish swim; gills take oxygen from water."],
["Identify the carnivore among the following","కింది వానిలో మాంసాహారిని గుర్తించండి",[["Crow","కాకి"],["Pig","పంది"],["Giraffe","జిరాఫీ"],["Shark","సొరచేప"]],4,"సొరచేప ఇతర చేపలను వేటాడి తింటుంది – మాంసాహారి. కాకి, పంది ఉభయాహారులు; జిరాఫీ శాకాహారి.","The shark hunts other fish – a carnivore."],
["Jaggery and sugar are produced from this plant","బెల్లం మరియు పంచదారను ఈ మొక్క నుండి ఉత్పత్తి చేస్తారు",[["Beetroot","బీట్‌రూట్"],["Potato","బంగాళాదుంప"],["Wheat","గోధుమ"],["Sugarcane","చెరకు"]],4,"చెరకు కాండం నుండి తీసిన రసాన్ని మరిగించి బెల్లం, పంచదార తయారు చేస్తారు.","Sugarcane juice is boiled to make jaggery and sugar."],
["The edible part of potato is","బంగాళాదుంపలో తినదగిన భాగం",[["Stem","కాండం"],["Root","వేరు"],["Flower","పుష్పం"],["Fruit","ఫలం"]],1,"బంగాళాదుంప భూగర్భ కాండం (దుంప కాండం). దానిపై ఉండే 'కన్నులు' మొగ్గలు – ఇదే అది కాండం అని చెప్పే రుజువు.","Potato is an underground stem (tuber); its 'eyes' are buds."],
["The edible part of radish is","ముల్లంగిలో తినదగిన భాగం",[["Stem","కాండం"],["Root","వేరు"],["Flower","పుష్పం"],["Fruit","ఫలం"]],2,"ముల్లంగి ఆహారాన్ని నిల్వ చేసుకుని ఉబ్బిన తల్లివేరు. క్యారెట్, బీట్‌రూట్ కూడా వేర్లే.","Radish is a swollen tap root that stores food."],
["Mushroom is a","పుట్టగొడుగు ఒక",[["Alga","శైవలం"],["Flower","పుష్పం"],["Fungus","శిలీంధ్రం"],["Fruit","ఫలం"]],3,"పుట్టగొడుగుకు పత్రహరితం ఉండదు; కుళ్లుతున్న పదార్థాలపై పెరిగే శిలీంధ్రం.","Mushroom has no chlorophyll; it is a fungus growing on decaying matter."],
["Sunlight is the source of this vitamin","సూర్యరశ్మి వనరుగా ఉన్న విటమిన్",[["A","A"],["B1","B1"],["C","C"],["D","D"]],4,"సూర్యరశ్మి చర్మంపై పడినప్పుడు శరీరం విటమిన్ D ని తయారు చేసుకుంటుంది. దీని లోపం వల్ల రికెట్స్ వస్తుంది.","Skin makes vitamin D in sunlight; its deficiency causes rickets."],
["Deficiency of this vitamin causes scurvy","ఈ విటమిన్ లోపం వలన స్కర్వీ కలుగుతుంది",[["A","A"],["B1","B1"],["C","C"],["D","D"]],3,"విటమిన్ C లోపం వల్ల స్కర్వీ – చిగుళ్ల నుండి రక్తస్రావం. నిమ్మ, ఉసిరి, జామలో విటమిన్ C ఉంటుంది.","Vitamin C deficiency causes scurvy (bleeding gums). Found in lemon, amla, guava."],
["Deficiency of this mineral causes goitre","ఈ ఖనిజ లవణం లోపం వలన గాయిటర్ వ్యాధి కలుగుతుంది",[["Iodine","అయోడిన్"],["Calcium","కాల్షియం"],["Iron","ఇనుము"],["Chlorine","క్లోరిన్"]],1,"అయోడిన్ లోపం వల్ల థైరాయిడ్ గ్రంథి ఉబ్బుతుంది – గాయిటర్. అయోడిన్ కలిపిన ఉప్పు వాడాలి.","Iodine deficiency enlarges the thyroid gland (goitre); use iodised salt."],
["This type of irrigation is suitable for paddy crop","వరి పంటకు సరైన నీటి పారుదల విధానం",[["Sprinkler","స్ప్రింక్లర్"],["Field irrigation","క్షేత్ర నీటి పారుదల"],["Furrow irrigation","చాళ్ల నీటి పారుదల"],["Drip irrigation","బిందు సేద్యం"]],2,"వరి పొలంలో నీరు ఎప్పుడూ నిలిచి ఉండాలి. అందుకే పొలం మొత్తం నీటితో నింపే క్షేత్ర నీటి పారుదల సరైనది.","Paddy needs standing water, so the whole field is flooded."],
["This irrigation method is suitable for crops like chilli and cotton","మిరప మరియు ప్రత్తి వంటి పంటలకు సరైన నీటి పారుదల విధానం",[["Furrow irrigation","చాళ్ల నీటి పారుదల"],["Field irrigation","క్షేత్ర నీటి పారుదల"],["Sprinkler","స్ప్రింక్లర్"],["Drip irrigation","బిందు సేద్యం"]],1,"మొక్కల వరుసల మధ్య చాళ్లు (కాలువలు) తీసి వాటి ద్వారా నీరు పారిస్తారు. మిరప, ప్రత్తి వరుసలలో పెరుగుతాయి.","Water flows in furrows between rows of chilli and cotton plants."],
["The modern tool used in agriculture is","వ్యవసాయంలో ఉపయోగించే ఆధునిక పనిముట్టు",[["Crowbar","గడ్డపార"],["Paddy transplanter","వరినాట్ల యంత్రం"],["Seed drill (gorru)","విత్తనాల గొర్రు"],["Sickle","కొడవలి"]],2,"వరినాట్ల యంత్రం ఆధునిక యంత్రం – తక్కువ సమయంలో ఎక్కువ నాట్లు వేస్తుంది. గడ్డపార, గొర్రు, కొడవలి సాంప్రదాయ పనిముట్లు.","The paddy transplanter is a modern machine; the others are traditional tools."],
["In this method of irrigation, water is supplied in a controlled way like rain","ఈ నీటి పారుదల విధానంలో నియంత్రిత పద్ధతిలో వర్షంలా నీటిని చల్లుతారు",[["Field irrigation","క్షేత్ర నీటి పారుదల"],["Furrow irrigation","చాళ్ల నీటి పారుదల"],["Sprinkler","స్ప్రింక్లర్"],["Drip irrigation","బిందు సేద్యం"]],3,"స్ప్రింక్లర్‌లో పైపులు, తిరిగే నాజిల్‌ల ద్వారా నీరు వర్షంలా పంటపై చల్లబడుతుంది.","Sprinkler nozzles spray water over crops like rain."],
["This is a good indicator of environmental damage","పర్యావరణం దెబ్బతినడాన్ని తెలియజేసే మంచి సూచిక",[["Frog","కప్ప"],["Squirrel","ఉడుత"],["Crow","కాకి"],["Fish","చేప"]],1,"కప్ప తేమ చర్మం ద్వారా కూడా శ్వాసిస్తుంది, కాబట్టి నీరు, గాలి కాలుష్యానికి త్వరగా ప్రభావితమవుతుంది. కప్పలు తగ్గితే పర్యావరణం దెబ్బతిన్నట్లు.","Frogs breathe through moist skin and are quickly harmed by pollution."],
["This is a good indicator of environmental damage","పర్యావరణం దెబ్బతినడాన్ని తెలియజేసే మంచి సూచిక",[["Butterfly","సీతాకోకచిలుక"],["Fish","చేప"],["Crow","కాకి"],["Squirrel","ఉడుత"]],1,"సీతాకోకచిలుకలు పూల మొక్కలు, శుభ్రమైన వాతావరణంపై ఆధారపడతాయి. పురుగుమందులు, కాలుష్యం పెరిగితే అవి త్వరగా కనుమరుగవుతాయి.","Butterflies vanish quickly when pesticides and pollution increase."],
["This is not a reason for accidents","ప్రమాదాలకు కారణం కానిది",[["Over speed","మితిమీరిన వేగం"],["Careless driving","అజాగ్రత్తగా నడపడం"],["Drunk driving","మద్యం సేవించి వాహనం నడపడం"],["Stopping at signal","సిగ్నల్ దగ్గర ఆపడం"]],4,"సిగ్నల్ దగ్గర ఆపడం రహదారి నియమం – ఇది ప్రమాదాలను నివారిస్తుంది. మిగిలినవి ప్రమాదాలకు కారణాలు.","Stopping at signals is a safety rule; it prevents accidents."],
["This is a reason for accidents","ప్రమాదాలకు కారణమైనది",[["Careful driving","జాగ్రత్తగా నడపడం"],["Triple riding on a two-wheeler","ద్విచక్ర వాహనంపై ఇద్దరి కంటే ఎక్కువ మంది ప్రయాణించడం"],["Stopping at signals","సిగ్నల్ దగ్గర వాహనం ఆపడం"],["Not talking on mobile while driving","వాహనం నడిపేటప్పుడు సెల్‌ఫోన్ మాట్లాడకపోవడం"]],2,"ద్విచక్ర వాహనంపై ముగ్గురు ఎక్కితే బ్యాలెన్స్ తప్పి ప్రమాదం జరుగుతుంది. మిగిలినవి మంచి అలవాట్లు.","Triple riding upsets balance and causes accidents."],
["The toll-free number for free health advice is","ఉచిత వైద్య సలహాలను అందించే టోల్ ఫ్రీ నంబరు",[["100","100"],["104","104"],["116","116"],["101","101"]],2,"104 – ఉచిత వైద్య సలహా. 100 – పోలీస్, 101 – అగ్నిమాపక దళం, 108 – అంబులెన్స్.","104 = health advice; 100 = police; 101 = fire; 108 = ambulance."],
["This house is known as a house on wheels","చక్రాలపై ఉండే ఇల్లుగా పిలువబడేది",[["Caravan","కారవాన్"],["Pucca house","పక్కా ఇల్లు"],["Kutcha house","కచ్చా ఇల్లు"],["Tent house","గుడారం"]],1,"కారవాన్‌కు చక్రాలు ఉంటాయి, వాహనంతో లాగి ఒక చోట నుండి మరో చోటికి తీసుకెళ్లవచ్చు.","A caravan has wheels and can be pulled from place to place."],
["This house is made with bricks, sand and iron","ఇటుకలు, ఇసుక మరియు ఇనుముతో నిర్మించబడిన ఇల్లు",[["Caravan","కారవాన్"],["Kutcha house","కచ్చా ఇల్లు"],["Pucca house","పక్కా ఇల్లు"],["Tent house","గుడారం"]],3,"ఇటుకలు, సిమెంట్, ఇసుక, ఇనుము వంటి గట్టి పదార్థాలతో కట్టేది పక్కా ఇల్లు.","Strong materials like bricks, cement and iron make a pucca house."],
["This house is made with mud and straw","మట్టి మరియు గడ్డితో నిర్మించే ఇల్లు",[["Kutcha house","కచ్చా ఇల్లు"],["Pucca house","పక్కా ఇల్లు"],["Tent house","గుడారం"],["Caravan","కారవాన్"]],1,"మట్టి, గడ్డి, వెదురు వంటి పదార్థాలతో కట్టే ఇల్లు కచ్చా ఇల్లు.","Mud, straw and bamboo make a kutcha house."],
["This bird makes big holes in the trunk of trees","ఈ పక్షి చెట్ల కాండానికి పెద్ద తొర్రలు చేస్తుంది",[["Sparrow","పిచ్చుక"],["Weaver bird","గిజిగాడు"],["Woodpecker","వడ్రంగి పిట్ట"],["Crow","కాకి"]],3,"వడ్రంగి పిట్ట గట్టి, పదునైన ముక్కుతో కాండాన్ని తొలిచి తొర్ర చేసి అందులో గూడు కట్టుకుంటుంది.","The woodpecker drills holes in trunks with its strong beak."],
["This bird makes its nest with grass and straws","గడ్డి మరియు గడ్డిపోచలను ఉపయోగించి తన గూడును నిర్మించే పక్షి",[["Sparrow","పిచ్చుక"],["Woodpecker","వడ్రంగి పిట్ట"],["Weaver bird","గిజిగాడు"],["Crow","కాకి"]],3,"గిజిగాడు గడ్డిపోచలను నేర్పుగా అల్లి చెట్టు కొమ్మకు వేలాడే అందమైన గూడు నిర్మిస్తుంది.","The weaver bird weaves a hanging nest from grass blades."],
["The term 'cell' was coined by","'కణం' అనే పేరును ప్రతిపాదించినవారు",[["Robert Brown","రాబర్ట్ బ్రౌన్"],["Robert Hooke","రాబర్ట్ హుక్"],["Leeuwenhoek","లీవెన్‌హుక్"],["Louis Pasteur","లూయీ పాశ్చర్"]],2,"1665లో రాబర్ట్ హుక్ బెండు (కార్క్) ముక్కను సూక్ష్మదర్శినిలో చూసి చిన్న గదులను 'సెల్' అన్నాడు. రాబర్ట్ బ్రౌన్ కేంద్రకాన్ని కనుగొన్నాడు.","Robert Hooke (1665) saw small chambers in cork and named them cells."],
["The basic structural units in living organisms are","సజీవులలోని ప్రాథమిక నిర్మాణాత్మక ప్రమాణాలు",[["Organs","అవయవాలు"],["Tissues","కణజాలాలు"],["Organ systems","అవయవ వ్యవస్థలు"],["Cells","కణాలు"]],4,"జీవులన్నీ కణాలతో నిర్మితమవుతాయి. కణం → కణజాలం → అవయవం → అవయవ వ్యవస్థ → జీవి.","All living things are made of cells: cell → tissue → organ → organ system."],
["This is not a unicellular organism","ఇది ఏకకణ జీవి కాదు",[["Amoeba","అమీబా"],["Paramecium","పారామీషియం"],["Mushroom","పుట్టగొడుగు"],["Euglena","యూగ్లీనా"]],3,"పుట్టగొడుగు అనేక కణాలతో ఏర్పడిన బహుకణ శిలీంధ్రం. అమీబా, పారామీషియం, యూగ్లీనా ఏకకణ జీవులు.","Mushroom is multicellular; the others are single-celled."],
["The largest cell is","అతి పెద్ద కణం",[["Bacteria","బాక్టీరియా"],["WBC","తెల్ల రక్తకణం"],["Ostrich egg","ఉష్ట్రపక్షి గుడ్డు"],["Hen egg","కోడి గుడ్డు"]],3,"ఉష్ట్రపక్షి గుడ్డు ప్రపంచంలోనే అతిపెద్ద ఏక కణం. అతి చిన్న కణాలలో బాక్టీరియా (మైకోప్లాస్మా) ఉన్నాయి.","The ostrich egg is the largest single cell."],
["This is a long and branched cell that carries impulses","ఇది పొడవుగా, శాఖలతో ఉండి ప్రచోదనాలను (సందేశాలను) తీసుకువెళ్లే కణం",[["Muscle cell","కండర కణం"],["Nerve cell","నాడీ కణం"],["Bone cell","ఎముక కణం"],["Blood cell","రక్త కణం"]],2,"నాడీ కణం (న్యూరాన్) శరీరంలో అత్యంత పొడవైన కణం. దాని శాఖలు సందేశాలను మెదడుకు, మెదడు నుండి చేరవేస్తాయి.","The nerve cell (neuron) is long and branched to carry messages."],
["The most important and controlling component of a living cell is","జీవ కణంలోని అతి ముఖ్యమైన మరియు నియంత్రణ భాగం",[["Cytoplasm","కణద్రవ్యం"],["Cell membrane","కణత్వచం"],["Vacuole","రిక్తిక"],["Nucleus","కేంద్రకం"]],4,"కేంద్రకం కణంలోని అన్ని పనులను నియంత్రిస్తుంది; ఇందులో క్రోమోజోములు ఉంటాయి. దీనిని కణ 'మెదడు' అంటారు.","The nucleus controls all cell activities and holds chromosomes."],
["Cell wall is present in","కణకవచం కలిగిన కణం",[["RBC","ఎర్ర రక్తకణం"],["Egg cell","అండ కణం"],["Onion peel cell","ఉల్లిపొర కణం"],["Muscle cell","కండర కణం"]],3,"కణకవచం మొక్క కణాలలో మాత్రమే ఉంటుంది. ఉల్లిపొర కణం మొక్క కణం; మిగిలినవి జంతు కణాలు.","Cell wall is found only in plant cells; onion peel is a plant cell."],
["A group of similar cells performing a specific function is called","ఒక నిర్దిష్టమైన విధిని నిర్వర్తించే ఒకే పోలికలు గల కణాల సమూహాన్ని ఇలా అంటారు",[["Organ","అవయవం"],["Organism","జీవి"],["Tissue","కణజాలం"],["Organ system","అవయవ వ్యవస్థ"]],3,"ఒకే రకమైన కణాలు కలిసి ఒకే పని చేస్తే అది కణజాలం. ఉదా: కండర కణజాలం, దారువు.","Similar cells working together form a tissue, e.g. muscle tissue."]
];
const N=Q.length, ans=new Array(N).fill(0); let cur=0, lang="both", done=false;
const $=s=>document.querySelector(s), app=$("#app"), card=$("#card"), grid=$("#grid");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setLang(l){lang=l;app.classList.toggle("hide-en",l==="te");app.classList.toggle("hide-te",l==="en");
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));}
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
function stats(){let ok=0,bad=0;ans.forEach((a,i)=>{if(a){a===Q[i][3]?ok++:bad++}});return{ok,bad,left:N-ok-bad}}
function bar(){const s=stats();$("#score").innerHTML=`సరైనవి <b>${s.ok}</b> · తప్పులు <i>${s.bad}</i> · మిగిలినవి ${s.left}`;
  $("#prog").style.width=((N-s.left)/N*100)+"%";
  grid.querySelectorAll("button").forEach((b,i)=>{b.className=(ans[i]?(ans[i]===Q[i][3]?"ok":"bad"):"")+(i===cur&&!done?" cur":"")});}
function render(){done=false;const [qe,qt,op,c,xt,xe]=Q[cur],a=ans[cur];
  let h=`<div class="qnum">ప్రశ్న ${cur+1} / ${N}</div><div class="q"><span class="en">${esc(qe)}</span><span class="te">${esc(qt)}</span></div><div class="opts">`;
  op.forEach((o,i)=>{const k=i+1;let cl="opt";if(a){if(k===c)cl+=" correct";else if(k===a)cl+=" wrong"}
    h+=`<button class="${cl}" data-k="${k}" id="opt-${k}" ${a?"disabled":""}><span class="n">${k}</span><span class="t">${o[0]===o[1]?esc(o[0]):`<span class="en">${esc(o[0])}</span><span class="te">${esc(o[1])}</span>`}</span></button>`});
  h+=`</div>`;
  if(a){const r=a===c;h+=`<div class="exp" role="status"><h3 class="${r?"verdict-ok":"verdict-bad"}">${r?"✔ సరైన సమాధానం!":"✘ తప్పు సమాధానం – సరైనది: ("+c+") "+esc(op[c-1][1])}</h3><p class="te">${esc(xt)}</p><p class="en">${esc(xe)}</p></div>`}
  h+=`<div class="nav"><button class="prev" id="prev" ${cur===0?"disabled":""}>◀ వెనుకకు</button><button class="next" id="next">${cur===N-1?"ఫలితం చూడండి":"తర్వాత ▶"}</button></div>`;
  card.innerHTML=h;
  card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ans[cur]=+b.dataset.k;render();bar()}));
  $("#prev").onclick=()=>{cur--;render();bar()};
  $("#next").onclick=()=>{if(cur===N-1)result();else{cur++;render();bar()}};
  bar();}
function result(){done=true;const s=stats(),p=Math.round(s.ok/N*100);
  const m=p>=90?"అద్భుతం! TET కి మీరు సిద్ధం.":p>=60?"బాగుంది! తప్పులు మరోసారి చూడండి.":"ఇంకా సాధన అవసరం. వివరణలు చదివి మళ్లీ ప్రయత్నించండి.";
  card.innerHTML=`<div class="result"><div class="qnum">మీ ఫలితం</div><div class="big">${s.ok} / ${N}</div><div class="msg">${p}% · ${m}</div>
  <div>తప్పులు: ${s.bad} · జవాబు ఇవ్వనివి: ${s.left}</div>
  <div class="row"><button id="rev" class="alt">తప్పులను సమీక్షించండి</button><button id="again">మళ్లీ మొదలుపెట్టండి</button></div></div>`;
  $("#again").onclick=()=>{ans.fill(0);cur=0;render();window.scrollTo({top:0})};
  $("#rev").onclick=()=>{const i=ans.findIndex((a,j)=>a!==Q[j][3]);cur=i<0?0:i;render()};
  bar();card.scrollIntoView({block:"start"});}
for(let i=0;i<N;i++){const b=document.createElement("button");b.textContent=i+1;b.setAttribute("aria-label","ప్రశ్న "+(i+1));
  b.onclick=()=>{cur=i;render();card.scrollIntoView({block:"start",behavior:"smooth"})};grid.appendChild(b)}
render();
</script>
