<title>AP TET 1A EVS క్విజ్ 51–100</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@600;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>
/* Layout: single centred column — photo header, question card, number grid, credit footer */
:root{
  --bg:#eef3ea; --surface:#ffffff; --ink:#1b2a1e; --muted:#566b59; --line:#cddbc8;
  --leaf:#2e6b3c; --leaf-soft:#dcebd9; --sun:#e2a516; --sun-soft:#fbefcc;
  --ok:#1f7a3a; --ok-soft:#d8f0dd; --bad:#b3261e; --bad-soft:#f8dcd9;
  --display:"Baloo Tammudu 2","Noto Sans Telugu",system-ui,sans-serif;
  --body:"Noto Sans Telugu","Nirmala UI","Gautami",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a14; --surface:#1b261d; --ink:#e7efe5; --muted:#a6b9a8; --line:#2f4033;
  --leaf:#7cc98c; --leaf-soft:#22382a; --sun:#f0bf45; --sun-soft:#3a3120;
  --ok:#6fd38a; --ok-soft:#1d3a26; --bad:#ff8a80; --bad-soft:#3e2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a14; --surface:#1b261d; --ink:#e7efe5; --muted:#a6b9a8; --line:#2f4033;
  --leaf:#7cc98c; --leaf-soft:#22382a; --sun:#f0bf45; --sun-soft:#3a3120;
  --ok:#6fd38a; --ok-soft:#1d3a26; --bad:#ff8a80; --bad-soft:#3e2220; color-scheme:dark}
html{font-size:20px}
@media (min-width:700px){html{font-size:22px}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;font-size:1rem}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  background:linear-gradient(160deg,var(--leaf) 0%,#1f4f2b 100%);color:#fff;border-radius:22px;padding:22px 16px}
header img{width:132px;height:132px;object-fit:cover;object-position:top;border-radius:50%;border:5px solid var(--sun);box-shadow:0 6px 18px rgba(0,0,0,.25)}
header .who{font-weight:700;font-size:1.05rem}
header h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.25;margin:0;text-wrap:balance}
header .sub{font-size:.95rem;opacity:.92;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;border:2px solid var(--leaf);background:transparent;color:var(--leaf);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--bg)}
.score{font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem}
.score b{color:var(--ok)} .score i{color:var(--bad);font-style:normal}
.progress{height:12px;background:var(--leaf-soft);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.qnum{font-family:var(--display);font-weight:800;color:var(--leaf);font-size:1.15rem;letter-spacing:.02em}
.q{font-size:1.3rem;font-weight:700;line-height:1.5}
.q .te{display:block;font-weight:600;color:var(--leaf);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:1.15rem;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;
  padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt:focus-visible,.chip:focus-visible,.nav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt .n{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.opt .t{min-width:0} .opt .t .te{display:block;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)} .opt.correct .n{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .n{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.exp{border-radius:14px;padding:14px 16px;background:var(--sun-soft);border:2px dashed var(--sun);font-size:1.1rem}
.exp h3{margin:0 0 6px;font-family:var(--display);font-size:1.15rem}
.exp p{margin:0} .exp p+p{margin-top:6px}
.verdict-ok{color:var(--ok)} .verdict-bad{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between}
.nav button{font:inherit;font-size:1.05rem;font-weight:700;padding:12px 18px;border-radius:14px;border:none;cursor:pointer;flex:1}
.prev{background:var(--leaf-soft);color:var(--leaf)} .next{background:var(--leaf);color:var(--bg)}
.nav button:disabled{opacity:.4;cursor:default}
.gridwrap h2{font-family:var(--display);font-size:1.15rem;margin:0 0 8px;color:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.grid button{font:inherit;font-size:.95rem;font-weight:700;padding:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:3px solid var(--sun);outline-offset:1px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--leaf);line-height:1}
.result .msg{font-size:1.2rem;font-weight:700}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.result .row button{font:inherit;font-weight:700;padding:12px 18px;border-radius:14px;border:none;cursor:pointer;background:var(--leaf);color:var(--bg)}
.result .row button.alt{background:var(--sun);color:#1b2a1e}
footer{text-align:center;background:var(--leaf);color:#fff;border-radius:18px;padding:16px;font-size:1.05rem;font-weight:700;line-height:1.6}
footer small{display:block;font-weight:400;font-size:.85rem;opacity:.9}
.hide-en .en{display:none} .hide-te .te{display:none}
.hide-en .q .te{margin-top:0;color:var(--ink)} .hide-en .opt .t .te{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const Q=[
["Chromosomes are present in this cell organelle","క్రోమోజోములు ఈ కణాంగంలో ఉంటాయి",[["Cytoplasm","కణద్రవ్యం"],["Nucleus","కేంద్రకం"],["Vacuoles","రిక్తికలు"],["Cell membrane","కణత్వచం"]],2,"క్రోమోజోములు కేంద్రకంలో ఉంటాయి. వీటిలోని జన్యువులు (DNA) లక్షణాలను తల్లిదండ్రుల నుండి పిల్లలకు అందిస్తాయి.","Chromosomes lie in the nucleus and carry genes (DNA) that pass on traits."],
["The cell organelle that is absent in the animal cell","జంతు కణంలో ఉండని కణాంగం",[["Cell membrane","కణత్వచం"],["Mitochondria","మైటోకాండ్రియా"],["Nucleus","కేంద్రకం"],["Plastids","ప్లాస్టిడ్‌లు"]],4,"ప్లాస్టిడ్‌లు (హరితరేణువులు వంటివి) మొక్క కణాలలో మాత్రమే ఉంటాయి. కణకవచం కూడా జంతు కణంలో ఉండదు.","Plastids (like chloroplasts) are found only in plant cells."],
["Microorganisms can be seen only through a","సూక్ష్మజీవులను దీని ద్వారా మాత్రమే చూడగలం",[["Telescope","టెలిస్కోప్"],["Kaleidoscope","కెలిడోస్కోప్"],["Microscope","సూక్ష్మదర్శిని"],["Periscope","పెరిస్కోప్"]],3,"సూక్ష్మదర్శిని చిన్న వస్తువులను పెద్దవిగా చూపిస్తుంది. టెలిస్కోప్ దూరంలోని గ్రహాలు, నక్షత్రాలను చూడటానికి.","A microscope magnifies tiny objects; a telescope is for distant objects."],
["Influenza is caused by","ఇన్‌ఫ్లుయెంజాను కలుగజేసేది",[["Bacteria","బాక్టీరియా"],["Fungi","శిలీంధ్రం"],["Protozoa","ప్రోటోజోవా"],["Virus","వైరస్"]],4,"ఇన్‌ఫ్లుయెంజా (ఫ్లూ) వైరస్ వల్ల వస్తుంది. జలుబు, పోలియో, కోవిడ్-19 కూడా వైరస్ వ్యాధులే.","Influenza (flu) is a viral disease, like the common cold and polio."],
["Dysentery (amoebic) is caused by","డీసెంట్రీని (అమీబిక్ విరేచనాలు) కలుగజేసేది",[["Bacteria","బాక్టీరియా"],["Fungi","శిలీంధ్రం"],["Protozoa","ప్రోటోజోవా"],["Virus","వైరస్"]],3,"అమీబిక్ డీసెంట్రీ ఎంటమీబా అనే ప్రోటోజోవా వల్ల కలుషిత నీరు, ఆహారం ద్వారా వస్తుంది. మలేరియా కూడా ప్రోటోజోవా వ్యాధి.","Amoebic dysentery is caused by the protozoan Entamoeba through dirty water."],
["Chlamydomonas and Spirogyra belong to","క్లామిడోమోనాస్ మరియు స్పైరోగైరా దీనికి చెందుతాయి",[["Algae","శైవలాలు"],["Protozoa","ప్రోటోజోవా"],["Fungi","శిలీంధ్రాలు"],["Bacteria","బాక్టీరియా"]],1,"ఇవి పత్రహరితం కలిగిన ఆకుపచ్చ శైవలాలు. చెరువులలో పచ్చని పాచిగా కనిపిస్తాయి.","They are green algae with chlorophyll, seen as green scum in ponds."],
["Amoeba and Paramecium belong to","అమీబా మరియు పారామీషియం దీనికి చెందుతాయి",[["Algae","శైవలాలు"],["Protozoa","ప్రోటోజోవా"],["Fungi","శిలీంధ్రాలు"],["Bacteria","బాక్టీరియా"]],2,"అమీబా, పారామీషియం ఏకకణ ప్రోటోజోవా జీవులు. అమీబా మిథ్యాపాదాలతో, పారామీషియం శైలికలతో కదులుతాయి.","Both are single-celled protozoa; amoeba uses pseudopodia, paramecium uses cilia."],
["Penicillium and Aspergillus belong to","పెనిసీలియం మరియు ఆస్పర్జిల్లస్ దీనికి చెందుతాయి",[["Algae","శైవలాలు"],["Protozoa","ప్రోటోజోవా"],["Fungi","శిలీంధ్రాలు"],["Bacteria","బాక్టీరియా"]],3,"ఇవి బూజు (శిలీంధ్రాలు). పెనిసీలియం నుండి పెన్సిలిన్ అనే యాంటీబయాటిక్ తయారవుతుంది.","They are moulds (fungi); penicillin is made from Penicillium."],
["Lactobacillus bacteria take an active role in","లాక్టోబాసిల్లస్ బాక్టీరియా దీనిలో చురుకైన పాత్ర వహిస్తుంది",[["Nitrogen fixation","నత్రజని స్థాపన"],["Making of bread","బ్రెడ్ తయారీ"],["Making of curd","పెరుగు తయారీ"],["Making of alcohol","ఆల్కహాల్ తయారీ"]],3,"లాక్టోబాసిల్లస్ పాలను పెరుగుగా మారుస్తుంది. బ్రెడ్, ఆల్కహాల్ తయారీలో ఈస్ట్ ఉపయోగపడుతుంది.","Lactobacillus turns milk into curd; yeast is used for bread and alcohol."],
["The process of conversion of sugar into alcohol is called","చక్కెరను ఆల్కహాల్‌గా మార్చే ప్రక్రియ",[["Pasteurization","పాశ్చరైజేషన్"],["Fermentation","కిణ్వనం"],["Emulsification","ఎమల్సిఫికేషన్"],["Preservation","ప్రిజర్వేషన్ (నిల్వ)"]],2,"ఈస్ట్ చక్కెరను ఆల్కహాల్‌గా మార్చడాన్ని కిణ్వనం అంటారు. దీనిని లూయీ పాశ్చర్ కనుగొన్నాడు.","Yeast converting sugar to alcohol is fermentation, discovered by Louis Pasteur."],
["Penicillin was first prepared by","పెన్సిలిన్‌ను మొదటిసారి తయారు చేసినవారు",[["Ronald Ross","రోనాల్డ్ రాస్"],["Louis Pasteur","లూయీ పాశ్చర్"],["Alexander Fleming","అలెగ్జాండర్ ఫ్లెమింగ్"],["Edward Jenner","ఎడ్వర్డ్ జెన్నర్"]],3,"1928లో అలెగ్జాండర్ ఫ్లెమింగ్ బూజు నుండి మొదటి యాంటీబయాటిక్ పెన్సిలిన్ కనుగొన్నాడు.","Alexander Fleming discovered penicillin, the first antibiotic, in 1928."],
["Vaccine for smallpox was discovered by","మశూచి వ్యాధికి టీకాను కనుగొన్నవారు",[["Ronald Ross","రోనాల్డ్ రాస్"],["Louis Pasteur","లూయీ పాశ్చర్"],["Alexander Fleming","అలెగ్జాండర్ ఫ్లెమింగ్"],["Edward Jenner","ఎడ్వర్డ్ జెన్నర్"]],4,"1796లో ఎడ్వర్డ్ జెన్నర్ మశూచి టీకా కనుగొన్నాడు. రోనాల్డ్ రాస్ మలేరియా దోమ ద్వారా వ్యాపిస్తుందని నిరూపించాడు.","Edward Jenner made the smallpox vaccine (1796); Ronald Ross worked on malaria."],
["Female Anopheles mosquito is the carrier of","ఆడ అనాఫిలిస్ దోమ దీనికి వాహకం",[["Filaria","బోదకాలు"],["Malaria","మలేరియా"],["Dengue","డెంగ్యూ"],["Typhoid","టైఫాయిడ్"]],2,"ఆడ అనాఫిలిస్ దోమ మలేరియా పరాన్నజీవిని (ప్లాస్మోడియం) వ్యాపింపజేస్తుంది. డెంగ్యూ – ఏడిస్, బోదకాలు – క్యూలెక్స్ దోమలు.","Female Anopheles spreads malaria; Aedes spreads dengue; Culex spreads filaria."],
["This is a saprotroph","ఇది ఒక పూతికాహారి",[["Cuscuta","బంగారుతీగ"],["Mushroom","పుట్టగొడుగు"],["Hydrilla","హైడ్రిల్లా"],["Spirogyra","స్పైరోగైరా"]],2,"పుట్టగొడుగు కుళ్లుతున్న (మృత) పదార్థాల నుండి ఆహారం గ్రహిస్తుంది – పూతికాహారి. బంగారుతీగ పరాన్నజీవి.","Mushroom feeds on dead, decaying matter; Cuscuta is a parasite."],
["Organisms that prepare their own food are","తమ ఆహారాన్ని తామే తయారు చేసుకునే జీవులు",[["Heterotrophs","పరపోషకాలు"],["Saprotrophs","పూతికాహారులు"],["Parasites","పరాన్నజీవులు"],["Autotrophs","స్వయంపోషకాలు"]],4,"ఆకుపచ్చని మొక్కలు కిరణజన్య సంయోగక్రియ ద్వారా తమ ఆహారాన్ని తామే తయారుచేసుకుంటాయి – స్వయంపోషకాలు.","Green plants make their own food – autotrophs."],
["This plant depends completely on other plants for food","ఈ మొక్క తన ఆహారం కొరకు ఇతర మొక్కలపై పూర్తిగా ఆధారపడుతుంది",[["Croton","క్రోటన్"],["Money plant","మనీప్లాంట్"],["Cuscuta","బంగారుతీగ"],["Peepal","రావిచెట్టు"]],3,"బంగారుతీగకు పత్రహరితం ఉండదు. ఇది ఆతిథేయ మొక్కపై చుట్టుకుని దాని ఆహారాన్ని గ్రహించే పరాన్నజీవి.","Cuscuta has no chlorophyll and takes food from its host – a parasite."],
["This is an insectivorous plant","ఇది ఒక కీటకాహార మొక్క",[["Dahlia","డాలియా"],["Cuscuta","బంగారుతీగ"],["Nepenthes","నెపెంథిస్ (కూజా మొక్క)"],["Neem","వేప"]],3,"నెపెంథిస్ ఆకు కూజా ఆకారంలో ఉండి కీటకాలను బంధించి జీర్ణం చేసుకుంటుంది. నత్రజని కోసం ఇలా చేస్తుంది.","Nepenthes (pitcher plant) traps and digests insects for nitrogen."],
["Green plants prepare their food by the process called","ఆకుపచ్చని మొక్కలు తమ ఆహారాన్ని తయారుచేసుకునే ప్రక్రియ",[["Transpiration","బాష్పోత్సేకం"],["Absorption","శోషణ"],["Photosynthesis","కిరణజన్య సంయోగక్రియ"],["Saprotrophy","పూతికాహారం"]],3,"కార్బన్ డైఆక్సైడ్ + నీరు → (సూర్యరశ్మి, పత్రహరితం) → గ్లూకోజ్ + ఆక్సిజన్. ఇదే కిరణజన్య సంయోగక్రియ.","CO₂ + water → (sunlight, chlorophyll) → glucose + oxygen."],
["The gas released by green plants during photosynthesis","కిరణజన్య సంయోగక్రియలో ఆకుపచ్చని మొక్కలు విడుదల చేసే వాయువు",[["Carbon dioxide","కార్బన్ డైఆక్సైడ్"],["Oxygen","ఆక్సిజన్"],["Nitrogen","నత్రజని"],["Carbon monoxide","కార్బన్ మోనాక్సైడ్"]],2,"మొక్కలు కార్బన్ డైఆక్సైడ్ తీసుకుని ఆక్సిజన్‌ను విడుదల చేస్తాయి.","Plants take in CO₂ and release oxygen."],
["Guard cells are a part of","రక్షక కణాలు దీనిలో ఒక భాగం",[["Stomata","పత్రరంధ్రాలు"],["Sweat pores","స్వేద రంధ్రాలు"],["Egg shell","గుడ్డు పెంకు"],["Root hairs","మూలకేశాలు"]],1,"పత్రరంధ్రం చుట్టూ ఉండే రెండు చిక్కుడు గింజ ఆకారపు రక్షక కణాలు రంధ్రాన్ని తెరిచి, మూస్తాయి.","Two bean-shaped guard cells open and close each stoma."],
["Chlorophyll is not present in","పత్రహరితం దీనిలో ఉండదు",[["Algae","శైవలాలు"],["Pitcher plant","పిచర్ ప్లాంట్"],["Fungi","శిలీంధ్రాలు"],["Money plant","మనీప్లాంట్"]],3,"శిలీంధ్రాలకు పత్రహరితం ఉండదు, అందుకే అవి ఆహారం తయారు చేసుకోలేవు. పిచర్ ప్లాంట్ ఆకుపచ్చగా ఉండి ఆహారం తయారు చేసుకుంటుంది.","Fungi lack chlorophyll and cannot make food. The pitcher plant is green."],
["Symbiosis is seen in","సహజీవనం చూపేవి",[["Pitcher plant","నెపెంథిస్ మొక్క"],["Virus","వైరస్"],["Cuscuta","బంగారుతీగ"],["Lichens","లైకెన్‌లు"]],4,"లైకెన్‌లో శైవలం ఆహారం తయారు చేస్తుంది, శిలీంధ్రం నీరు, ఆశ్రయం ఇస్తుంది – ఇద్దరికీ లాభం. ఇదే సహజీవనం.","In lichens, alga makes food and fungus gives water and shelter – both benefit."],
["Nitrogen-fixing bacteria in legume plants is","పప్పుజాతి మొక్కలలో నత్రజని స్థాపించే బాక్టీరియా",[["Lactobacillus","లాక్టోబాసిల్లస్"],["Lichens","లైకెన్‌లు"],["Rhizobium","రైజోబియం"],["Rhizopus","రైజోపస్"]],3,"రైజోబియం పప్పుజాతి మొక్కల వేరు బుడిపెలలో నివసించి గాలిలోని నత్రజనిని నేలకు అందిస్తుంది. రైజోపస్ రొట్టె బూజు.","Rhizobium lives in root nodules of legumes and fixes nitrogen. Rhizopus is bread mould."],
["The longest part of the human digestive system is","మానవ జీర్ణవ్యవస్థలోని అత్యంత పొడవైన భాగం",[["Large intestine","పెద్దప్రేగు"],["Oesophagus","ఆహారవాహిక"],["Small intestine","చిన్నప్రేగు"],["Buccal cavity","ఆస్య కుహరం"]],3,"చిన్నప్రేగు సుమారు 6–7 మీటర్ల పొడవు ఉంటుంది. ఆహార జీర్ణక్రియ, శోషణ ఇక్కడే ఎక్కువగా జరుగుతాయి.","The small intestine is about 6–7 m long; most digestion and absorption happen there."],
["Salivary glands are present in","లాలాజల గ్రంథులు ఉండేది",[["Stomach","జీర్ణాశయం"],["Buccal cavity","ఆస్య కుహరం"],["Small intestine","చిన్నప్రేగు"],["Large intestine","పెద్దప్రేగు"]],2,"నోటిలో (ఆస్య కుహరం) మూడు జతల లాలాజల గ్రంథులు ఉంటాయి. లాలాజలం పిండిపదార్థాన్ని చక్కెరగా మారుస్తుంది.","Three pairs of salivary glands open into the mouth; saliva digests starch."],
["In humans, the teeth for piercing and tearing are","మనుషులలో గుచ్చి చీల్చడానికి ఉపయోగపడే దంతాలు",[["Incisors","కుంతకాలు"],["Canines","రదనికలు"],["Premolars","అగ్రచర్వణకాలు"],["Molars","చర్వణకాలు"]],2,"రదనికలు మొనదేలి ఉండి ఆహారాన్ని గుచ్చి చీలుస్తాయి. కుంతకాలు కొరకడానికి, చర్వణకాలు నమలడానికి.","Pointed canines pierce and tear; incisors cut; molars grind."],
["Bile juice is secreted by","పైత్యరసాన్ని స్రవించేది",[["Pancreas","క్లోమం"],["Stomach","జీర్ణాశయం"],["Liver","కాలేయం"],["Intestinal glands","ఆంత్రరస గ్రంథులు"]],3,"కాలేయం పైత్యరసాన్ని స్రవిస్తుంది; ఇది పిత్తాశయంలో నిల్వ ఉండి కొవ్వుల జీర్ణక్రియకు సహాయపడుతుంది.","The liver secretes bile, stored in the gall bladder; it helps digest fats."],
["The length of the small intestine in humans is","మానవునిలో చిన్నప్రేగు పొడవు",[["8 metres","8 మీటర్లు"],["10 metres","10 మీటర్లు"],["2 metres","2 మీటర్లు"],["6 metres","6 మీటర్లు"]],4,"చిన్నప్రేగు పొడవు సుమారు 6 మీటర్లు. పెద్దప్రేగు సుమారు 1.5 మీటర్లు.","The small intestine is about 6 m; the large intestine about 1.5 m."],
["The part through which food passes from mouth to stomach is","ఆహార పదార్థాలు నోటి నుండి జీర్ణాశయానికి దీని ద్వారా చేరుతాయి",[["Liver","కాలేయం"],["Oesophagus","ఆహారవాహిక"],["Small intestine","చిన్నప్రేగు"],["Large intestine","పెద్దప్రేగు"]],2,"ఆహారవాహిక (గ్రసని నుండి జీర్ణాశయం వరకు ఉండే గొట్టం) తరంగ చలనాల ద్వారా ఆహారాన్ని కిందికి నెడుతుంది.","The oesophagus pushes food down to the stomach by wave-like movements."],
["Chemicals that convert complex food into simple substances","సంక్లిష్ట ఆహార పదార్థాలను సరళ పదార్థాలుగా మార్చే రసాయన పదార్థాలు",[["Hormones","హార్మోన్లు"],["Enzymes","ఎంజైములు"],["Roughage","పీచు పదార్థాలు"],["Water","నీరు"]],2,"ఎంజైములు జీర్ణక్రియను వేగవంతం చేసే జీవ ఉత్ప్రేరకాలు. ఉదా: లాలాజలంలోని అమైలేజ్ (టయలిన్).","Enzymes are biological catalysts that break down food, e.g. salivary amylase."],
["The organism having pseudopodia is","మిథ్యాపాదాలను (సూడోపోడియా) కలిగి ఉన్న జీవి",[["Amoeba","అమీబా"],["Paramecium","పారామీషియం"],["Euglena","యూగ్లీనా"],["Diatom","డయాటమ్"]],1,"అమీబా మిథ్యాపాదాలతో కదులుతుంది, ఆహారాన్ని పట్టుకుంటుంది. పారామీషియం – శైలికలు, యూగ్లీనా – కశాభం.","Amoeba moves and catches food using pseudopodia."],

["In green plants, chloroplasts are found in large numbers in this part","ఆకుపచ్చని మొక్కలలో హరితరేణువులు అత్యధికంగా ఉండే భాగం",[["Roots","వేర్లు"],["Fruits","పండ్లు"],["Flowers","పుష్పాలు"],["Leaves","పత్రాలు"]],4,"ఆకులలోని పత్రాంతర కణాలలో హరితరేణువులు ఎక్కువగా ఉంటాయి, అందుకే ఆకులు ఆహారం తయారు చేస్తాయి.","Leaf cells are packed with chloroplasts, so leaves make food."],

["The two upper chambers of the heart are called","గుండెలోని పై రెండు గదులను ఇలా పిలుస్తారు",[["Atria","కర్ణికలు"],["Ventricles","జఠరికలు"],["Arteries","ధమనులు"],["Veins","సిరలు"]],1,"గుండెకు 4 గదులు: పై రెండు కర్ణికలు, కింది రెండు జఠరికలు.","The heart has 4 chambers: two upper atria, two lower ventricles."],

["This is essential for the release of energy from food in our body","మన శరీరంలో ఆహార పదార్థాల నుండి శక్తి విడుదల కావడానికి అవసరమైనది",[["Oxygen","ఆక్సిజన్"],["Carbon dioxide","కార్బన్ డైఆక్సైడ్"],["Nitrogen","నత్రజని"],["Hydrogen","హైడ్రోజన్"]],1,"కణాలలో గ్లూకోజ్ ఆక్సిజన్‌తో ఆక్సీకరణం చెంది శక్తి విడుదలవుతుంది (కణశ్వాసక్రియ).","Glucose is oxidised with oxygen in cells to release energy."],

function render(){done=false;const [qe,qt,op,c,xt,xe]=Q[cur],a=ans[cur];

  h+=`<div class="nav"><button class="prev" id="prev" ${cur===0?"disabled":""}>◀ వెనుకకు</button><button class="next" id="next">${cur===N-1?"ఫలితం చూడండి":"తర్వాత ▶"}</button></div>`;
  card.innerHTML=h;
  card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ans[cur]=+b.dataset.k;render();bar()}));
  $("#prev").onclick=()=>{cur--;render();bar()};
  $("#next").onclick=()=>{if(cur===N-1)result();else{cur++;render();bar()}};
  bar();}
function result(){done=true;const s=stats(),p=Math.round(s.ok/N*100);
  const m=p>=90?"అద్భుతం! TET కి మీరు సిద్ధం.":p>=60?"బాగుంది! తప్పులు మరోసారి చూడండి.":"ఇంకా సాధన అవసరం. వివరణలు చదివి మళ్లీ ప్రయత్నించండి.";
  card.innerHTML=`<div class="result"><div class="qnum">మీ ఫలితం</div><div class="big">${s.ok} / ${N}</div><div class="msg">${p}% · ${m}</div>
  <div>తప్పులు: ${s.bad} · జవాబు ఇవ్వనివి: ${s.left}</div>
  <div class="row"><button id="rev" class="alt">తప్పులను సమీక్షించండి</button><button id="again">మళ్లీ మొదలుపెట్టండి</button></div></div>`;
  $("#again").onclick=()=>{ans.fill(0);cur=0;render();window.scrollTo({top:0})};
  $("#rev").onclick=()=>{const i=ans.findIndex((a,j)=>a!==Q[j][3]);cur=i<0?0:i;render()};
  bar();card.scrollIntoView({block:"start"});}
for(let i=0;i<N;i++){const b=document.createElement("button");b.textContent=S+i;b.setAttribute("aria-label","ప్రశ్న "+(S+i));
  b.onclick=()=>{cur=i;render();card.scrollIntoView({block:"start",behavior:"smooth"})};grid.appendChild(b)}
render();
</script>
